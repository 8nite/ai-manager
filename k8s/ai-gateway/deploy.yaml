# k8s/opencode-auth/deploy.yaml
# Manifests for the ai-manager.nexvision.cc WebAuthn + WebSocket-tunnel gateway.
#
# Topology:
#   https://ai-manager.nexvision.cc
#     → ingress-nginx (TLS via cert-manager letsencrypt-prod)
#       → ai-manager-gateway Service :80
#         → ai-manager-gateway Pod :3000
#           ├─ /health, /auth/*, /login, /register, /styles.css  (served by the gateway)
#           └─ /tunnel  (WebSocket upgrade, authenticated by tunnel token)
#           └─ everything else  (requires session cookie, proxied to local opencode via tunnel)
#
# Local machine:
#   opencode serve --port 3000 --cors https://ai-manager.nexvision.cc
#   TUNNEL_TOKEN=... node scripts/opencode-tunnel.js
#
# Registration is tokenless self-service. The user opens
# https://ai-manager.nexvision.cc/register, creates a passkey, and gets a
# deviceId. The admin then runs:
#
#   kubectl -n nexvision exec deploy/ai-manager-gateway -- gateway-admin pending list
#   kubectl -n nexvision exec deploy/ai-manager-gateway -- gateway-admin pending approve <deviceId>
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ai-manager-data
  namespace: nexvision
  labels:
    app: ai-manager-gateway
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 100Mi
---
# The ConfigMap (ai-manager-gateway-code) is created by
# scripts/build-configmap.sh, which packages the source files from this dir.
# Don't list it here — the deploy.yaml apply would overwrite the real one
# with whatever placeholder we put, and the gateway would fail to start.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-manager-gateway
  namespace: nexvision
  labels:
    app: ai-manager-gateway
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: ai-manager-gateway
  template:
    metadata:
      labels:
        app: ai-manager-gateway
    spec:
      initContainers:
        - name: install-deps
          image: node:22-alpine
          command: ["sh", "-c"]
          args:
            - |
              set -e
              mkdir -p /app/public
              # ConfigMap volume mount creates symlinks (not regular files),
              # so use cp -L or readlink to dereference. Easier: just copy the
              # dereferenced contents of each symlink in /code.
              for f in /code/*.js; do
                [ -e "$f" ] || continue
                cp "$f" /app/
              done
              # ConfigMap keys like "public_index_html" hold the contents of
              # the public static files. Rename them on the way out.
              for f in /code/public_*; do
                [ -e "$f" ] || continue
                case "$(basename "$f")" in
                  public_index_html)    fname="index.html" ;;
                  public_login_html)    fname="login.html" ;;
                  public_register_html) fname="register.html" ;;
                  public_styles_css)    fname="styles.css" ;;
                  *) fname="$(basename "$f" | sed 's/^public_//')" ;;
                esac
                cp "$f" "/app/public/$fname"
              done
              ls -la /app /app/public
              cd /app
              npm init -y --silent > /dev/null
              npm install --silent --no-audit --no-fund \
                express@4 @simplewebauthn/server@13 ws@8
              echo "deps installed: $(ls node_modules | wc -l) packages"
          volumeMounts:
            - name: code
              mountPath: /code
            - name: app
              mountPath: /app
      containers:
        - name: gateway
          image: node:22-alpine
          command: ["node"]
          args: ["/app/server.js"]
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: RP_ID
              value: "ai-manager.nexvision.cc"
            - name: RP_NAME
              value: "AI Manager Gateway"
            - name: DATA_FILE
              value: "/app/data/registry.json"
            # Pinned backend password (optional). If the ai-manager-basic
            # Secret exists, the gateway injects it as Basic auth on
            # tunneled requests. Value lives in the Secret, NOT in git.
            # Marked optional so the pod starts without the Secret.
            - name: OPENCODE_SERVER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ai-manager-basic
                  key: password
                  optional: true
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
          volumeMounts:
            - name: app
              mountPath: /app
            - name: data
              mountPath: /app/data
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
              scheme: HTTP
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: 3000
              scheme: HTTP
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30
      restartPolicy: Always
      terminationGracePeriodSeconds: 10
      volumes:
        - name: code
          configMap:
            name: ai-manager-gateway-code
        - name: app
          emptyDir: {}
        - name: data
          persistentVolumeClaim:
            claimName: ai-manager-data
---
apiVersion: v1
kind: Service
metadata:
  name: ai-manager-gateway
  namespace: nexvision
  labels:
    app: ai-manager-gateway
spec:
  type: ClusterIP
  selector:
    app: ai-manager-gateway
  ports:
    - name: http
      port: 80
      targetPort: 3000
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ai-manager-gateway-ingress
  namespace: nexvision
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # WebSocket: long timeouts on the tunnel endpoint
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    # opencode serve uses SSE for streaming responses; no buffering
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-body-size: "16m"
    # The /tunnel path is the WebSocket endpoint; mark the service so nginx
    # handles Upgrade: websocket correctly
    nginx.ingress.kubernetes.io/websocket-services: ai-manager-gateway
    # CORS: opencode's web UI may do cross-origin requests; allow our origin
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://ai-manager.nexvision.cc"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization"
    nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: ai-manager.nexvision.cc
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ai-manager-gateway
                port:
                  number: 80
  tls:
    - hosts:
        - ai-manager.nexvision.cc
      secretName: ai-manager-gateway-cert
