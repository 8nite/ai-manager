<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=2">
<title>Sign in — OpenCode</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<main class="card">
  <h1>Sign in</h1>
  <p>Authenticate with your passkey to access <code id="host"></code>.</p>
  <button id="login" class="primary">Sign in with passkey</button>
  <p id="error" class="error" hidden></p>
  <p id="register-hint" class="hint" hidden>No devices are registered yet. <a href="/register">Register this device</a> first.</p>
  <p class="hint" id="default-hint">New device? <a href="/register">Register here</a>.</p>
</main>
<script>
document.getElementById("host").textContent = location.host;
const loginBtn = document.getElementById("login");
const errorEl = document.getElementById("error");
const registerHint = document.getElementById("register-hint");
const defaultHint = document.getElementById("default-hint");
function showError(m) { errorEl.textContent = m; errorEl.hidden = false; }
function clearError() { errorEl.hidden = true; errorEl.textContent = ""; }

// navigator.credentials.get() throws an opaque NotAllowedError with the
// message "An unknown error occurred while talking to the credential
// manager" in two real-world cases:
//   1) No passkeys are registered for this RP at all.
//   2) Passkeys are registered, but the current browser/authenticator
//      does not have any of them (e.g. user is on a different device
//      than the one that registered).
// The browser message is useless; map it to something actionable.
function explainCredError(e) {
  const name = e && e.name;
  const msg  = (e && e.message) || String(e);
  if (name === "NotAllowedError" || /credential manager/i.test(msg)) {
    return "No passkey found on this device. If you already registered, use the same browser/device. Otherwise, register this device first.";
  }
  if (name === "SecurityError")  return "Security error talking to the authenticator. Make sure you're on https://" + location.host + ".";
  return msg;
}

loginBtn.addEventListener("click", async () => {
  clearError();
  loginBtn.disabled = true;
  try {
    const beginRes = await fetch("/auth/login/begin", { method: "POST", credentials: "include" });
    const begin = await beginRes.json();
    if (!beginRes.ok) {
      if (begin.error === "no_approved_devices") {
        showError(begin.message || "No devices are registered yet.");
        registerHint.hidden = false;
        defaultHint.hidden = true;
        return;
      }
      throw new Error(begin.error || "begin failed");
    }
    const opts = begin.options;
    opts.challenge = b64uToBuf(opts.challenge);
    opts.allowCredentials = (opts.allowCredentials || []).map(c => ({ ...c, id: b64uToBuf(c.id) }));

    let cred;
    try {
      cred = await navigator.credentials.get({ publicKey: opts, mediation: "optional" });
    } catch (credErr) {
      // Browser refused to surface any passkey for this RP/device.
      throw new Error(explainCredError(credErr));
    }
    if (!cred) throw new Error("Sign-in cancelled.");

    const assertion = {
      id: cred.id,
      rawId: b64uEncode(new Uint8Array(cred.rawId)),
      type: cred.type,
      response: {
        clientDataJSON: b64uEncode(new Uint8Array(cred.response.clientDataJSON)),
        authenticatorData: b64uEncode(new Uint8Array(cred.response.authenticatorData)),
        signature: b64uEncode(new Uint8Array(cred.response.signature)),
      },
    };
    if (cred.response.userHandle) assertion.response.userHandle = b64uEncode(new Uint8Array(cred.response.userHandle));

    const fin = await fetch("/auth/login/finish", {
      method: "POST", credentials: "include",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ assertion, challengeId: begin.challengeId }),
    });
    const finJ = await fin.json();
    if (!fin.ok) throw new Error(finJ.error || "login failed");
    window.location.href = "/";
  } catch (e) {
    showError(e.message || String(e));
    loginBtn.disabled = false;
  }
});

function b64uToBuf(s) {
  s = s.replace(/-/g, "+").replace(/_/g, "/");
  while (s.length % 4) s += "=";
  const bin = atob(s);
  const buf = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
  return buf.buffer;
}
function b64uEncode(bytes) {
  let s = "";
  for (let i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
  return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
</script>
</body>
</html>
