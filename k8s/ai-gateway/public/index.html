<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=2">
<title>OpenCode</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<main class="card">
  <h1>OpenCode</h1>
  <p id="status">Loading…</p>
  <div id="actions" hidden>
    <button id="login" class="primary">Sign in with passkey</button>
    <p class="hint">Or, if this is a new device, <a href="/register">register it</a>.</p>
  </div>
  <p id="error" class="error" hidden></p>
</main>
<script>
(async function () {
  const statusEl = document.getElementById("status");
  const actionsEl = document.getElementById("actions");
  const errorEl = document.getElementById("error");
  const loginBtn = document.getElementById("login");

  function showError(msg) { errorEl.textContent = msg; errorEl.hidden = false; }
  function clearError() { errorEl.hidden = true; errorEl.textContent = ""; }

  try {
    const r = await fetch("/health");
    if (!r.ok) throw new Error("health check failed: " + r.status);
    const h = await r.json();
    statusEl.textContent = h.tunnelConnected
      ? "Tunnel online. Sign in to access opencode."
      : "Tunnel offline. Start the local opencode tunnel and reload.";
    actionsEl.hidden = false;
  } catch (e) {
    showError(e.message);
    return;
  }

  // If we already have a session cookie, jump straight to the opencode UI.
  try {
    const r = await fetch("/api/me", { credentials: "include" });
    if (r.ok) { window.location.href = "/"; return; }
  } catch {}

  loginBtn.addEventListener("click", async () => {
    clearError();
    loginBtn.disabled = true;
    try {
      const begin = await fetch("/auth/login/begin", { method: "POST", credentials: "include" }).then(r => r.json());
      const opts = begin.options;
      // simplewebauthn returns base64url strings; browser WebAuthn needs ArrayBuffer
      opts.challenge = b64uToBuf(opts.challenge);
      opts.allowCredentials = (opts.allowCredentials || []).map(c => ({ ...c, id: b64uToBuf(c.id) }));

      const cred = await navigator.credentials.get({ publicKey: opts, mediation: "optional" });
      if (!cred) throw new Error("no credential returned");

      // Encode the assertion for the server. Server expects
      // { id, rawId, type, response: { clientDataJSON, authenticatorData, signature, userHandle? } }
      const assertion = {
        id: cred.id,
        rawId: b64uEncode(new Uint8Array(cred.rawId)),
        type: cred.type,
        response: {
          clientDataJSON: b64uEncode(new Uint8Array(cred.response.clientDataJSON)),
          authenticatorData: b64uEncode(new Uint8Array(cred.response.authenticatorData)),
          signature: b64uEncode(new Uint8Array(cred.response.signature)),
        },
      };
      if (cred.response.userHandle) assertion.response.userHandle = b64uEncode(new Uint8Array(cred.response.userHandle));

      const fin = await fetch("/auth/login/finish", {
        method: "POST",
        credentials: "include",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ assertion, challengeId: begin.challengeId }),
      });
      const finJ = await fin.json();
      if (!fin.ok) throw new Error(finJ.error || "login failed");
      window.location.href = "/";
    } catch (e) {
      showError(e.message || String(e));
      loginBtn.disabled = false;
    }
  });

  function b64uToBuf(s) {
    s = s.replace(/-/g, "+").replace(/_/g, "/");
    while (s.length % 4) s += "=";
    const bin = atob(s);
    const buf = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
    return buf.buffer;
  }
  function b64uEncode(bytes) {
    let s = "";
    for (let i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
    return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  }
})();
</script>
</body>
</html>
